<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>consulta-dni :: terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05090a;
    --panel: #060c08;
    --glow: #45ffa0;
    --glow-dim: #1f6b46;
    --glow-faint: #123322;
    --amber: #ffcf6b;
    --red: #ff6b6b;
    --text: #c9ffe0;
    --text-dim: #4f9c74;
    --border: #16351f;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: radial-gradient(ellipse at 50% 0%, #0a1510 0%, #04070a 65%, #020403 100%);
    color: var(--text);
    font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  /* ---------- marco de terminal ---------- */

  .term {
    position: relative;
    width: min(880px, 100%);
    height: min(680px, 92vh);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow:
      0 0 0 1px rgba(69, 255, 160, 0.05),
      0 20px 60px rgba(0, 0, 0, 0.6),
      0 0 90px rgba(69, 255, 160, 0.06);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .term-titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: #081109;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .term-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--glow-faint);
    border: 1px solid var(--glow-dim);
  }

  .term-title {
    margin-left: 4px;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .term-status {
    margin-left: auto;
    font-size: 0.68rem;
    color: var(--glow-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .term-status .led {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--glow);
    box-shadow: 0 0 6px var(--glow);
  }

  /* ---------- cuerpo / scroll de historial ---------- */

  .term-screen {
    position: relative;
    flex: 1;
    overflow: hidden;
  }

  .term-body {
    height: 100%;
    overflow-y: auto;
    padding: 18px 20px 90px;
    font-size: 0.84rem;
    line-height: 1.65;
  }

  .term-body::-webkit-scrollbar { width: 8px; }
  .term-body::-webkit-scrollbar-thumb {
    background: var(--glow-faint);
    border-radius: 4px;
  }

  /* efecto CRT: scanlines + viñeta, no interactivo */
  .term-screen::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 0px,
      rgba(0, 0, 0, 0) 2px,
      rgba(0, 0, 0, 0.18) 3px
    );
    mix-blend-mode: multiply;
    z-index: 3;
  }
  .term-screen::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%);
    z-index: 3;
  }

  @keyframes flicker {
    0%, 97%, 100% { opacity: 1; }
    98% { opacity: 0.94; }
    99% { opacity: 0.98; }
  }
  .term-body { animation: flicker 7s infinite; }

  /* ---------- lineas ---------- */

  .ascii {
    color: var(--glow);
    text-shadow: 0 0 6px rgba(69, 255, 160, 0.35);
    font-size: 0.72rem;
    white-space: pre;
    margin-bottom: 4px;
  }

  .boot-line {
    color: var(--text-dim);
    font-size: 0.78rem;
  }
  .boot-line .ok { color: var(--glow); }

  .line { margin: 2px 0; white-space: pre-wrap; word-break: break-word; }
  .line.dim { color: var(--text-dim); }
  .line.error { color: var(--red); }
  .line.ok { color: var(--glow); }
  .line.amber { color: var(--amber); }

  .prompt-tag {
    color: var(--glow);
    text-shadow: 0 0 4px rgba(69, 255, 160, 0.4);
  }
  .prompt-arg { color: var(--text); }

  .dots span {
    animation: pulse 1.2s infinite;
    opacity: 0.2;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }

  /* JSON resaltado */
  .json-key { color: #7fd9ff; }
  .json-string { color: #a9f5c9; }
  .json-number { color: var(--amber); }
  .json-punct { color: var(--text-dim); }

  /* ---------- linea de input activa ---------- */

  .term-inputbar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 4;
    padding: 12px 20px 16px;
    background: linear-gradient(to top, var(--panel) 60%, rgba(6, 12, 8, 0));
  }

  .input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
    font-size: 0.86rem;
  }

  .input-row .prompt-tag { flex-shrink: 0; }

  .input-row input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font: inherit;
    caret-color: var(--glow);
    letter-spacing: 0.02em;
  }

  .input-row input::placeholder {
    color: var(--glow-faint);
  }

  .input-row input:focus {
    text-shadow: 0 0 6px rgba(69, 255, 160, 0.35);
  }

  .hint {
    margin-top: 6px;
    font-size: 0.68rem;
    color: var(--glow-faint);
    letter-spacing: 0.03em;
  }

  @media (max-width: 560px) {
    .term { height: 94vh; border-radius: 6px; }
    .ascii { font-size: 0.58rem; }
    .term-body { padding: 14px 14px 90px; font-size: 0.78rem; }
  }
</style>
</head>
<body>

  <div class="term" role="application" aria-label="Terminal de consulta de DNI">
    <div class="term-titlebar">
      <span class="term-dot"></span>
      <span class="term-dot"></span>
      <span class="term-dot"></span>
      <span class="term-title">consulta-dni@root</span>
      <span class="term-status"><span class="led"></span> online</span>
    </div>

    <div class="term-screen">
      <div class="term-body" id="term-body">
        <div class="boot-line" id="boot-line-1"></div>
        <div class="boot-line" id="boot-line-2"></div>
        <div class="boot-line" id="boot-line-3"></div>
        <div class="line dim" id="boot-line-4"></div>
      </div>
    </div>

    <div class="term-inputbar">
      <form id="form-dni" class="input-row" autocomplete="off">
        <span class="prompt-tag">root@consulta:~$</span>
        <input
          type="tel"
          id="dni"
          name="dni"
          inputmode="numeric"
          maxlength="8"
          placeholder="ingresa un DNI de 8 dígitos y presiona Enter"
          aria-label="Número de DNI"
          autofocus
        />
      </form>
      <div class="hint">comandos: escribe el DNI y presiona <strong>Enter</strong> — se validan 8 dígitos numéricos</div>
    </div>
  </div>

  <script>
    const termBody = document.getElementById('term-body');
    const form = document.getElementById('form-dni');
    const dniInput = document.getElementById('dni');

    // Solo dígitos en el input
    dniInput.addEventListener('input', () => {
      dniInput.value = dniInput.value.replace(/\D/g, '');
    });

    function scrollAbajo() {
      termBody.scrollTop = termBody.scrollHeight;
    }

    function agregarLinea(texto, clase = '') {
      const el = document.createElement('div');
      el.className = `line ${clase}`.trim();
      el.textContent = texto;
      termBody.appendChild(el);
      scrollAbajo();
      return el;
    }

    function agregarLineaHTML(html, clase = '') {
      const el = document.createElement('div');
      el.className = `line ${clase}`.trim();
      el.innerHTML = html;
      termBody.appendChild(el);
      scrollAbajo();
      return el;
    }

    function agregarComando(texto) {
      const el = document.createElement('div');
      el.className = 'line';
      const tag = document.createElement('span');
      tag.className = 'prompt-tag';
      tag.textContent = 'root@consulta:~$ ';
      el.appendChild(tag);
      const arg = document.createElement('span');
      arg.className = 'prompt-arg';
      arg.textContent = texto;
      el.appendChild(arg);
      termBody.appendChild(el);
      scrollAbajo();
      return el;
    }

    function agregarEspera(texto) {
      const el = document.createElement('div');
      el.className = 'line dim';
      const dots = document.createElement('span');
      dots.className = 'dots';
      dots.innerHTML = '<span>.</span><span>.</span><span>.</span>';
      el.appendChild(document.createTextNode(texto + ' '));
      el.appendChild(dots);
      termBody.appendChild(el);
      scrollAbajo();
      return el;
    }

    // Resalta JSON como texto coloreado (escapando antes de insertar)
    function resaltarJSON(obj) {
      const json = JSON.stringify(obj, null, 2);
      const escapado = json
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      return escapado.replace(
        /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g,
        (match) => {
          let cls = 'json-number';
          if (/^"/.test(match)) {
            cls = /:$/.test(match) ? 'json-key' : 'json-string';
          } else if (/true|false|null/.test(match)) {
            cls = 'json-punct';
          }
          return `<span class="${cls}">${match}</span>`;
        }
      );
    }

    function mostrarJSON(obj) {
      agregarLineaHTML(resaltarJSON(obj));
    }

    // ---------- secuencia de arranque ----------

    const bootLines = [
      { el: document.getElementById('boot-line-1'), text: 'Iniciando sistema...', delay: 200 },
      { el: document.getElementById('boot-line-2'), text: 'Conectando con el servidor...', delay: 550 },
      { el: document.getElementById('boot-line-3'), text: 'Conexión establecida.', delay: 900 },
    ];

    bootLines.forEach(({ el, text, delay }) => {
      setTimeout(() => {
        el.innerHTML = `<span class="ok">✔</span> ${text}`;
      }, delay);
    });

    setTimeout(() => {
      document.getElementById('boot-line-4').textContent =
        'Escribe un número de DNI (8 dígitos) y presiona Enter para consultar.';
      scrollAbajo();
    }, 1150);

    // ---------- envío ----------

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const dni = dniInput.value.trim();

      agregarComando(`consultar --dni ${dni || '(vacío)'}`);

      if (!/^\d{8}$/.test(dni)) {
        agregarLinea('✖ Error: el DNI debe tener exactamente 8 dígitos numéricos.', 'error');
        return;
      }

      dniInput.disabled = true;
      const lineaEspera = agregarEspera('Consultando datos');

      try {
        const resp = await fetch('/api/consultar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dni }),
        });

        const data = await resp.json();
        lineaEspera.remove();

        if (!resp.ok) {
          agregarLinea(`✖ Error ${resp.status}`, 'error');
          mostrarJSON(data);

          if (data.diagnostico) {
            agregarLinea('--- diagnóstico ---', 'dim');
            agregarLinea(`url final : ${data.diagnostico.urlActual}`, 'dim');
            agregarLinea(`título    : ${data.diagnostico.titulo}`, 'dim');
            agregarLinea(`texto     : ${data.diagnostico.textoVisible}`, 'dim');
          }
          if (data.stack) {
            agregarLinea(data.stack, 'dim');
          }
        } else {
          agregarLinea(`✔ 200 OK — registro encontrado`, 'ok');
          mostrarJSON(data);
          agregarLinea(
            `» ${data.nombres} ${data.apellidoPaterno} ${data.apellidoMaterno}`,
            'amber'
          );
        }
      } catch (err) {
        lineaEspera.remove();
        agregarLinea('✖ No se pudo conectar con el servidor.', 'error');
      } finally {
        dniInput.disabled = false;
        dniInput.value = '';
        dniInput.focus();
      }
    });

    // clic en cualquier parte de la pantalla enfoca el input, como una terminal real
    document.querySelector('.term-screen').addEventListener('click', () => dniInput.focus());
  </script>
</body>
</html>
